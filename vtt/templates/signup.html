                    <article class="book-spread-page book-spread-page--right">

                            <h2 class="book-spread-page-title"><span data-ui-key="u_ee23d015fdc3">Dein Konto</span></h2>
                            <p class="book-spread-page-copy"><span data-ui-key="u_b065e4e74fd4">Fülle das Formular aus und melde dich danach direkt an.</span></p>
                        </header>

                            <span class="book-dashboard-chip"><span data-ui-key="u_8b3fb89d1cd2">E-Mail-Wiederherstellung</span></span>

                                        <div class="book-password-item" id="req-lower"><span data-ui-key="u_9f6a56db7ff1">Ein Kleinbuchstabe</span></div>

    <script src="/static/js/auth.js"></script>

    <script>globalThis.VTTUi ||= (source,parameters={}) => globalThis.VTTI18n?.literal(source,parameters) ?? source.replace(/\{([a-zA-Z0-9_]+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(parameters,k)?String(parameters[k]):m);
globalThis.VTTUiHTML ||= source => globalThis.VTTUi(source).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        window.BookSceneRouteInit = window.BookSceneRouteInit || {};
        window.BookSceneRouteInit.signup = function initSignupScene() {
            const signupForm = document.getElementById('signupForm');
            const registrationKeyInput = document.getElementById('registration_key');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const statusBanner = document.getElementById('statusBanner');

            if (!signupForm || !registrationKeyInput || !passwordInput || !submitBtn || !statusBanner) {
                return;
            }

            passwordInput.addEventListener('input', (event) => {
                const password = event.target.value;
                updateRequirement('req-length', password.length >= 8);
                updateRequirement('req-upper', /[A-Z]/.test(password));
                updateRequirement('req-lower', /[a-z]/.test(password));
                updateRequirement('req-digit', /\d/.test(password));
                updateRequirement('req-special', /[!@#$%^&*_\-+=]/.test(password));
            });

            signupForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const registration_key = registrationKeyInput.value.trim().toUpperCase();
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim().toLowerCase();
                const password = passwordInput.value;

                clearErrors();
                showLoading(true);

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ registration_key, username, email, password })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        handleErrorResponse(data);
                        showLoading(false);
                        return;
                    }

                    showBanner('Konto erstellt. Du wirst zur Anmeldung weitergeleitet …', 'success');
                    window.setTimeout(() => {
                        // Deferred deep link (Invite-Flow A1): ein mitgegebenes
                        // next= überlebt die Registrierung bis nach dem Login.
                        // Nur seiteninterne Pfade, sonst offener Redirect.
                        const nextParam = new URL(window.location.href).searchParams.get('next');
                        const safeNext = nextParam && nextParam.startsWith('/') && !nextParam.startsWith('//')
                            ? `&next=${encodeURIComponent(nextParam)}`
                            : '';
                        window.location.href = `/login.html?signup=1${safeNext}`;
                    }, 900);
                } catch (error) {
                    showError('generalError', 'Netzwerkfehler: ' + error.message);
                    showLoading(false);
                }
            });

            function updateRequirement(elementId, met) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.classList.toggle('is-met', met);
                }
            }

            function clearErrors() {
                document.getElementById('registrationKeyError').textContent = '';
                document.getElementById('usernameError').textContent = '';
                document.getElementById('emailError').textContent = '';
                document.getElementById('passwordError').textContent = '';
                document.getElementById('generalError').textContent = '';
                statusBanner.hidden = true;
                statusBanner.textContent = '';
                statusBanner.className = 'book-form-banner';
            }

            function showError(elementId, message) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.textContent = message;
                }
            }

            function handleErrorResponse(data) {
                const error = data.error || 'Signup failed';

                if (error.includes('registration key') || error.includes('key')) {
                    showError('registrationKeyError', error);
                    return;
                }
                if (error.includes('username')) {
                    showError('usernameError', error);
                    return;
                }
                if (error.includes('email') || error.includes('Email')) {
                    showError('emailError', error);
                    return;
                }
                if (error.includes('password') || error.includes('Password')) {
                    showError('passwordError', error);
                    return;
                }

                showError('generalError', error);
            }

            function showLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.textContent = isLoading ? globalThis.VTTUi("Konto wird erstellt …") : globalThis.VTTUi("Konto erstellen");
            }

            function showBanner(message, tone) {
                statusBanner.hidden = false;
                statusBanner.textContent = message;
                statusBanner.className = `book-form-banner is-${tone}`;
                showLoading(false);
            }
        };

        async function bootstrapSignupScene() {
            try {
                const user = await Auth.getCurrentUser();
                if (user) {
                    const nextParam = new URL(window.location.href).searchParams.get('next');
                    window.location.href = nextParam && nextParam.startsWith('/') && !nextParam.startsWith('//')
                        ? nextParam
                        : '/dashboard';
                    return;
                }

                if (!window.BookScene) {
                    throw new Error(globalThis.VTTUi("Book scene unavailable"));
                }

                BookScene.create();
                BookScene.bootstrapRoute('signup');
            } catch (error) {
                console.error('Failed to bootstrap signup scene:', error);
                window.location.href = '/login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', bootstrapSignupScene);
    </script>
</body>
