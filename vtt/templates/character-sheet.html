<head>

    <title data-ui-key="u_da578ad217b8">Charakterbogen - roll drauf vtt</title>
    <link rel="icon" type="image/png" href="/static/assets/sternenstaub/icons/server-icon-64.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .sheet-core-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.7rem;
        }

        .sheet-core-grid .field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .sheet-core-grid .field--wide {
            grid-column: 1 / -1;
        }

        .sheet-core-grid .field label,
        .sheet-form-inline label,
        .sheet-pane-title {
            font-size: 0.78rem;
            color: #8e6b52;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .sheet-core-grid input,
        .sheet-form-inline input,
        .sheet-form-inline textarea,
        .sheet-form-inline select {
            background: rgba(255, 252, 246, 0.78);
            color: #2a1a12;
            border: 1px solid rgba(130, 89, 52, 0.22);
            border-radius: 10px;
            padding: 0.55rem 0.7rem;
            font: inherit;
        }

        .sheet-core-grid input:disabled,
        .sheet-form-inline input:disabled,
        .sheet-form-inline textarea:disabled,
        .sheet-form-inline select:disabled {
            opacity: 0.72;
            cursor: not-allowed;
        }

        .sheet-stat-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .sheet-stat {
            padding: 0.7rem 0.8rem;
            border-radius: 12px;
            background: rgba(255, 252, 246, 0.72);
            border: 1px solid rgba(130, 89, 52, 0.14);
        }

        .sheet-stat-label {
            font-size: 0.72rem;
            color: #8e6b52;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sheet-stat-value {
            margin-top: 0.22rem;
            color: #2f1638;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .sheet-pane {
            display: grid;
            gap: 0.8rem;
        }

        .sheet-pane + .sheet-pane {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(130, 89, 52, 0.12);
        }

        .sheet-pane[hidden] {
            display: none !important;
        }

        .homebrew-origin-profile,
        .homebrew-origin-traits {
            display: grid;
            gap: 0.75rem;
            min-width: 0;
        }

        .homebrew-origin-facts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.7rem;
        }

        .homebrew-origin-facts dt {
            color: #8e6b52;
            font-size: 0.78rem;
        }

        .homebrew-origin-facts dd {
            color: #2f1638;
            margin-top: 0.2rem;
        }

        .homebrew-origin-copy {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .homebrew-origin-trait {
            padding: 0.85rem;
            border: 1px solid rgba(130, 89, 52, 0.18);
            border-radius: 12px;
            background: rgba(255, 252, 246, 0.68);
            display: grid;
            gap: 0.55rem;
            min-width: 0;
        }

        .homebrew-origin-trait h3,
        .homebrew-origin-profile h3 {
            overflow-wrap: anywhere;
            color: #2f1638;
        }

        .sheet-pane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .sheet-pane-copy {
            color: var(--vtt-ink-muted, #6e5745);
            line-height: 1.5;
            font-size: 0.94rem;
        }

        .sheet-form-inline {
            display: grid;
            gap: 0.65rem;
        }

        .sheet-form-inline .inline-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
        }

        .sheet-list {
            display: grid;
            gap: 0.6rem;
        }

        .sheet-item {
            border: 1px solid rgba(130, 89, 52, 0.14);
            border-radius: 12px;
            padding: 0.8rem 0.9rem;
            background: rgba(255, 252, 246, 0.68);
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .sheet-item strong {
            color: #2f1638;
        }

        .sheet-item-meta {
            margin-top: 0.22rem;
            font-size: 0.84rem;
            color: var(--vtt-ink-muted, #6e5745);
            line-height: 1.4;
        }

        .sheet-split-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .sheet-split-actions .btn {
            min-height: 42px;
        }

        .sheet-mode-note {
            padding: 0.85rem 0.95rem;
            border-radius: 14px;
            border: 1px solid rgba(202, 163, 59, 0.22);
            background: rgba(202, 163, 59, 0.08);
            color: var(--vtt-plum-deep, #2f1638);
            line-height: 1.5;
        }

        .sheet-empty {
            padding: 0.95rem 1rem;
            border-radius: 12px;
            border: 1px dashed rgba(130, 89, 52, 0.24);
            color: var(--vtt-ink-muted, #6e5745);
            background: rgba(255, 252, 246, 0.58);
        }

        .sheet-help {
            color: var(--vtt-ink-muted, #6e5745);
            font-size: 0.84rem;
            line-height: 1.4;
            margin-top: -0.15rem;
        }

        .sheet-actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .sheet-actions-row .btn {
            min-width: 140px;
        }

        .sheet-empty-state {
            display: grid;
            gap: 0.8rem;
            justify-items: start;
            padding: 2rem;
            border: 1px dashed rgba(130, 89, 52, 0.24);
            border-radius: 16px;
            background: rgba(255, 252, 246, 0.58);
        }

        .book-spread[hidden] {
            display: none !important;
        }

        body .book-dashboard-page.book-focus-page.sheet-focus-page .book-spread {
            grid-template-columns: minmax(0, 1fr);
            max-width: 62rem;
            margin-inline: auto;
        }

        body .book-dashboard-page.book-focus-page.sheet-focus-page .book-page--index .book-page-folio {
            display: none;
        }

        body[data-sheet-empty="true"] .sheet-focus-page .book-shell-frame-header,
        body[data-sheet-empty="true"] .sheet-focus-page .book-shell-ribbon {
            display: none;
        }

        #sheetEmptyState[hidden] {
            display: none !important;
        }

        .sheet-empty-state h2,
        .sheet-empty-state p {
            margin: 0;
        }

        .sheet-empty-state p {
            color: var(--vtt-ink-muted, #6e5745);
            line-height: 1.5;
        }

        .sheet-identity-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .sheet-identity-card {
            display: grid;
            gap: 0.7rem;
            padding: 0.85rem;
            border-radius: 14px;
            border: 1px solid rgba(130, 89, 52, 0.18);
            background: rgba(255, 252, 246, 0.68);
        }

        .sheet-identity-label {
            color: #8e6b52;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .sheet-identity-preview {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(130, 89, 52, 0.18);
            background: linear-gradient(135deg, rgba(143, 102, 155, 0.12), rgba(255, 252, 246, 0.88));
            display: grid;
            place-items: center;
            color: var(--vtt-plum-deep, #2f1638);
            font-size: 1.8rem;
        }

        .sheet-identity-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sheet-identity-copy {
            color: var(--vtt-ink-muted, #6e5745);
            line-height: 1.45;
            font-size: 0.88rem;
        }

        .sheet-identity-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .sheet-identity-actions .btn {
            flex: 1 1 140px;
        }

        .sheet-export-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            background: rgba(74, 158, 255, 0.08);
            border: 1px solid rgba(74, 158, 255, 0.25);
            color: #1a3a5c;
            font-weight: 600;
            font-size: 0.86rem;
            cursor: pointer;
            letter-spacing: 0.02em;
        }
        .sheet-export-btn:hover {
            background: rgba(74, 158, 255, 0.16);
        }
        .sheet-next-hint {
            margin-top: 0.5rem;
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #4a1e5a;
            background: rgba(143, 102, 155, 0.07);
            border: 1px solid rgba(143, 102, 155, 0.18);
            line-height: 1.45;
        }
        .sheet-next-hint[hidden] { display: none; }

        .srd-sheet-facts,
        .srd-sheet-vitals,
        .srd-sheet-abilities {
            display: grid;
            gap: 0.45rem;
            margin-bottom: 0.8rem;
        }
        .srd-sheet-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .srd-sheet-vitals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .srd-sheet-abilities { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .srd-sheet-cell {
            padding: 0.45rem 0.65rem;
            border-radius: 8px;
            background: rgba(143, 102, 155, 0.06);
            border: 1px solid rgba(143, 102, 155, 0.15);
            min-width: 0;
        }
        .srd-sheet-label {
            font-size: 0.72rem;
            color: #8e6b52;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .srd-sheet-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #2f1638;
            margin-top: 0.12rem;
            overflow-wrap: anywhere;
        }
        .srd-sheet-value small {
            font-weight: 500;
            color: #6e5745;
        }
        .srd-sheet-ability-score {
            font-size: 1.35rem;
            font-weight: 800;
            color: #4b235a;
        }
        .srd-sheet-subtitle {
            margin: 0.9rem 0 0.4rem;
            font-size: 0.78rem;
            color: #8e6b52;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .srd-sheet-skills {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.2rem 0.9rem;
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.86rem;
        }
        .srd-sheet-skills li {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.18rem 0;
            border-bottom: 1px dotted rgba(130, 89, 52, 0.18);
        }
        .srd-sheet-skills .is-proficient { font-weight: 700; color: #4b235a; }
        .srd-sheet-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .srd-sheet-tag {
            padding: 0.18rem 0.55rem;
            border-radius: 999px;
            font-size: 0.8rem;
            background: rgba(75, 35, 90, 0.08);
            border: 1px solid rgba(75, 35, 90, 0.2);
            color: #2f1638;
        }
        .srd-sheet-label { overflow-wrap: anywhere; }
        .srd-rollbar {
            position: sticky;
            top: 0;
            z-index: 3;
            display: grid;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
            padding: 0.55rem 0.65rem;
            border-radius: 8px;
            background: #f6efe0;
            border: 1px solid rgba(75, 35, 90, 0.35);
        }
        .srd-rollbar-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.6rem;
        }
        .srd-rollbar-head label { font-size: 0.78rem; color: #6e5745; }
        .srd-rollbar select { padding: 0.2rem 0.4rem; }
        .srd-roll-result {
            font-weight: 700;
            color: #2f1638;
            font-size: 0.95rem;
            overflow-wrap: anywhere;
        }
        .srd-roll-result.is-crit { color: #1f6b2e; }
        .srd-roll-result.is-fumble { color: #9c2a2a; }
        .srd-roll-where { font-weight: 400; font-size: 0.78rem; color: #6e5745; }
        .srd-roll-destination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem 0.6rem;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            font-size: 0.82rem;
            line-height: 1.4;
            color: #2f1638;
            background: rgba(110, 87, 69, 0.08);
            border-left: 4px solid #8e6b52;
            overflow-wrap: anywhere;
        }
        .srd-roll-destination[data-state="live"] { background: rgba(31, 107, 46, 0.1); border-left-color: #1f6b2e; }
        .srd-roll-destination[data-state="choose"] { background: rgba(202, 163, 59, 0.14); border-left-color: #a8842c; }
        .srd-roll-destination[data-state="blocked"] { background: rgba(156, 42, 42, 0.1); border-left-color: #9c2a2a; }
        .srd-roll-destination strong { font-weight: 700; }
        .srd-roll-destination select { max-width: 100%; }
        .srd-roll-jump { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; font-size: 0.78rem; color: #6e5745; }
        .srd-roll-link {
            font: inherit;
            cursor: pointer;
            border: 1px solid rgba(75, 35, 90, 0.25);
            border-radius: 6px;
            background: none;
            color: #4b235a;
            padding: 0.1rem 0.45rem;
        }
        .srd-roll-link:hover, .srd-roll-link:focus-visible { background: rgba(75, 35, 90, 0.1); }
        #srdSheetBody .srd-sheet-subtitle, #srdInventory { scroll-margin-top: 11rem; }
        .srd-roll-history {
            margin: 0;
            padding-left: 1.1rem;
            font-size: 0.8rem;
            color: #6e5745;
        }
        .srd-roll-btn {
            font: inherit;
            cursor: pointer;
            border: 1px solid rgba(75, 35, 90, 0.35);
            border-radius: 6px;
            background: rgba(75, 35, 90, 0.07);
            color: #4b235a;
            padding: 0.15rem 0.5rem;
            font-weight: 700;
        }
        .srd-roll-btn:hover, .srd-roll-btn:focus-visible { background: rgba(75, 35, 90, 0.18); }
        .srd-roll-btn:disabled { opacity: 0.55; cursor: progress; }
        .srd-sheet-skills li .srd-roll-btn { display: flex; justify-content: space-between; width: 100%; gap: 0.5rem; text-align: left; border-color: transparent; background: none; font-weight: inherit; color: inherit; }
        .srd-sheet-skills li .srd-roll-btn:hover { background: rgba(75, 35, 90, 0.1); }
        .srd-roll-pair { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.3rem; }
        .srd-sheet-note {
            margin: 0.6rem 0 0;
            font-size: 0.83rem;
            color: #6e5745;
            line-height: 1.45;
        }
        .srd-sheet-link {
            display: inline-block;
            margin-top: 0.6rem;
            font-weight: 700;
            color: #4b235a;
        }
        @media (max-width: 620px) {
            .srd-roll-jump { display: none; }
            .srd-sheet-facts,
            .srd-sheet-skills { grid-template-columns: 1fr; }
            .srd-sheet-vitals,
            .srd-sheet-abilities { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }


        @media (max-width: 900px) {
            .sheet-core-grid,
            .sheet-form-inline .inline-row,
            .sheet-stat-row,
            .sheet-identity-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .sheet-actions-row .btn {
                min-width: 0;
                flex: 1 1 100%;
            }
        }

        .srd-sheet-provenance {margin:1rem 0;padding:.8rem;border:1px solid currentColor;border-radius:.6rem;overflow-wrap:anywhere;}
        .srd-sheet-provenance > details {padding:.5rem 0;border-bottom:1px solid var(--border-color,#b7a383);}
        .srd-sheet-provenance summary {cursor:pointer;font-weight:600;}
    </style>

    <style>

            background: #0d0514;

            overflow-y: auto;

        .sheet-focus-page .book-dashboard-titlebar,

            display: none;

            display: none;
        }

        .sheet-journey-nav .sheet-split-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

        .sheet-journey-nav .sheet-split-actions .btn {

        .sheet-focus-page .sheet-identity-preview {

        /* Only shown when loading is slow: a small note over the open book,

            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%);
            padding: 0.45rem 1rem;
            border-radius: 999px;
            background: rgba(13, 5, 20, 0.78);
            color: #f6e8c8;
            font-family: var(--vtt-font-heading);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            z-index: 9600;
        }

        #characterSheetSceneStatus[hidden] {
            display: none;
        }

        .sheet-focus-page .book-shell-ribbon {
            top: 18px;
            right: 18px;
            z-index: 4;
        }

        .sheet-focus-page .book-shell-frame-header {
            margin-bottom: 1.2rem;
            padding-right: 88px;
        }

        @media (max-width: 1040px) {
            .sheet-focus-page .book-shell-frame-header {
                padding-right: 0;
            }

            .sheet-focus-page .book-shell-ribbon {
                position: static;
                writing-mode: initial;
                transform: none;
                min-height: 0;
                display: inline-flex;
                margin-bottom: 1rem;
            }
        }

        .sheet-focus-page .book-shell-ribbon {
            display: none;
        }

    </style>

        function updateJourneyContext(character) {
            const contextButton = document.getElementById('campaignContextBtn');
            const hintEl = document.getElementById('sheetNextHint');

            if (contextButton) {
                if (character?.campaign_id) {
                    contextButton.hidden = false;
                    contextButton.textContent = globalThis.VTTUi("Kampagnen-Kontext");
                    contextButton.dataset.bookRoute = `/campaigns?campaign_id=${character.campaign_id}`;
                } else {
                    contextButton.hidden = false;
                    contextButton.textContent = globalThis.VTTUi("Kampagnen-Hub");
                    contextButton.dataset.bookRoute = '/campaigns';
                }
            }

            if (!hintEl) return;

            // State-based hint: pick the most actionable next step
            const hasAvatar = !!character?.avatar_url;
            const hasToken = !!character?.token_url;

            let hint = '';
            if (!hasAvatar && !hasToken) {
                hint = 'Lade Avatar und Token hoch, um den Charakter visuell zu vervollständigen.';
            } else if (!hasAvatar) {
                hint = 'Avatar fehlt noch — lade ein Bild hoch, um die Identität zu vervollständigen.';
            } else if (!hasToken) {
                hint = 'Token fehlt noch — lade ein Bild für den Spieltisch hoch.';
            } else if (!character?.campaign_id) {
                hint = 'Charakter bereit. Weise ihn einer Kampagne zu, bevor es an den Tisch geht.';
            } else {
                hint = 'Charakter vollständig. Kehre zum Kampagnen-Kontext zurück, wenn du bereit für die Session bist.';
            }

            hintEl.textContent = hint;
            hintEl.hidden = false;
        }

        const SRD_SYSTEM_ID = 'srd_5_2_1_de';
        const SRD_MANAGED_INPUTS = [
            'charRace', 'charClass', 'charBackground', 'charLevel', 'charXp', 'charAc', 'charHpMax',
            'charStr', 'charDex', 'charCon', 'charInt', 'charWis', 'charCha'
        ];
        const SRD_ABILITY_ORDER = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
        const SRD_ABILITY_NAMES = { str: globalThis.VTTUi("Stärke"), dex: globalThis.VTTUi("Geschicklichkeit"), con: globalThis.VTTUi("Konstitution"), int: globalThis.VTTUi("Intelligenz"), wis: globalThis.VTTUi("Weisheit"), cha: globalThis.VTTUi("Charisma") };
        const SRD_SLOT_ORDINALS = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
        let srdCreatorData = null;
        let srdSubclassNames = {};
        let srdRenderToken = 0;
        let srdRollMode = 'normal';
        const srdRollHistory = [];
        const SRD_ROLL_MODES = [['normal', globalThis.VTTUi("Normal")], ['advantage', globalThis.VTTUi("Vorteil")], ['disadvantage', globalThis.VTTUi("Nachteil")]];
        // Sheet to table: opened from a table, the URL names its session and every roll carries it.
        // The server refuses a roll for a wrong or finished table instead of sending it elsewhere.
        let srdTableSession = params.get('session_id') || null;
        let srdRollContext = null;
        let srdRollContextAt = 0;
        let srdRollContextToken = 0;
        const SRD_LOCAL_REASONS = {
            no_campaign: 'Der Charakter gehört zu keiner Kampagne.',
            no_session: 'In der Kampagne läuft gerade keine Sitzung, an der du mitspielst.',
        };

        function appendText(parent, tag, text, className = '') {
            const node = document.createElement(tag);

            parent.append(node);

        }

        function isSrdCharacter(character) {

        function signed(value) {
            const number = Number(value) || 0;
            return number >= 0 ? `+${number}` : `−${Math.abs(number)}`;

        function srdLookup(list, id) {

        function srdRollButton(text, kind, key, character, extraClass, extraBody) {

        function renderSrdRollResult(entry) {
            const node = document.getElementById('srdRollResult');
            const history = document.getElementById('srdRollHistory');
            if (!node || !history) return;
            node.className = `srd-roll-result${entry.natural === 20 ? ' is-crit' : ''}${entry.natural === 1 ? ' is-fumble' : ''}`;
            node.replaceChildren();
            node.append(document.createTextNode(entry.error || entry.text));
            if (!entry.error) {
                appendText(node, 'span', entry.logged
                    ? globalThis.VTTUi(" · live am Tisch{p0}",{p0:(entry.table ? ` „${entry.table}“` : '')})
                    : globalThis.VTTUi(" · nur hier, nicht am Tisch{p0}",{p0:(entry.reason ? ` – ${entry.reason}` : '')}), 'srd-roll-where');
            }
            history.replaceChildren();
            srdRollHistory.slice(1, 6).forEach((past) => appendText(history, 'li', `${past.text}${past.logged ? ' · am Tisch' : ' · nur hier'}`));
        }

        // Like auth.makeAuthRequest, but keeps the server's status, message and extra fields.
        async function srdTableRequest(url, method = 'GET', body = null, retryOn401 = true) {
            const options = { method, credentials: 'include', headers: Auth.buildHeaders(method, body !== null) };
            if (body !== null) options.body = JSON.stringify(body);
            const response = await fetch(url, options);
            if (response.status === 401 && retryOn401) {
                if (await Auth.refreshAccessToken()) return srdTableRequest(url, method, body, false);
                window.location.href = '/login.html';
                return null;
            }
            return { ok: response.ok, status: response.status, payload: await response.json().catch(() => ({})) };
        }

        async function loadSrdRollContext(character, force = false) {
            if (!character?.id || (!force && Date.now() - srdRollContextAt < 5000)) return;
            srdRollContextAt = Date.now();
            const token = ++srdRollContextToken;
            const query = srdTableSession ? `?session_id=${encodeURIComponent(srdTableSession)}` : '';
            let next;
            try {
                const answer = await srdTableRequest(`/api/srd-creator/characters/${character.id}/roll-context${query}`);
                if (!answer) return;
                next = answer.ok ? answer.payload
                    : { error: answer.payload.error || 'failed', message: answer.payload.message || globalThis.VTTUi("Das Würfelziel konnte nicht geprüft werden.") };
            } catch (error) {
                next = { error: 'offline', message: globalThis.VTTUi("Das Würfelziel konnte nicht geprüft werden (keine Verbindung).") };
            }
            if (token !== srdRollContextToken) return;
            srdRollContext = next;
            renderSrdRollDestination(character);
        }

        function bindSrdTable(character, sessionId) {
            srdTableSession = sessionId ? String(sessionId) : null;
            const url = new URL(window.location.href);
            if (srdTableSession) url.searchParams.set('session_id', srdTableSession);
            else url.searchParams.delete('session_id');
            window.history.replaceState(window.history.state, '', url);
            srdRollContext = null;
            renderSrdRollDestination(character);
            loadSrdRollContext(character, true);
        }

        // Where the next click goes, shown before the player rolls.
        function renderSrdRollDestination(character, node) {
            const box = node || document.getElementById('srdRollDestination');
            if (!box) return;
            const context = srdRollContext;
            box.replaceChildren();
            let state = 'checking';
            if (!context) {
                appendText(box, 'span', globalThis.VTTUi("Würfelziel wird geprüft …"));
            } else if (context.error) {
                state = 'blocked';
                appendText(box, 'strong', globalThis.VTTUi("Kein Tisch: "));
                appendText(box, 'span', `${context.message} ${srdTableSession ? 'Solange dieser Tisch gewählt ist, wird nicht gewürfelt.' : ''}`.trim());
            } else if (context.live) {
                state = 'live';
                appendText(box, 'strong', globalThis.VTTUi("Live am Tisch „{p0}“: ",{p0:(context.session.name)}));
                appendText(box, 'span', context.explicit
                    ? globalThis.VTTUi("Würfe erscheinen sofort im Würfel- und Chat-Protokoll dieses Tisches.")
                    : globalThis.VTTUi("Würfe erscheinen sofort im Würfel- und Chat-Protokoll (einzige laufende Sitzung)."));
            } else if (context.reason === 'choose_session') {
                state = 'choose';
                const label = appendText(box, 'label', globalThis.VTTUi("Mehrere Sitzungen laufen. Würfle an Tisch: "));
                label.htmlFor = 'srdRollSession';
                const select = document.createElement('select');
                select.id = 'srdRollSession';
                select.append(new Option('Tisch wählen …', ''));
                (context.sessions || []).forEach((entry) => select.append(new Option(entry.name, String(entry.id))));
                select.addEventListener('change', () => { if (select.value) bindSrdTable(character, select.value); });
                box.append(select);
            } else {
                state = 'local';
                appendText(box, 'strong', globalThis.VTTUi("Nur hier: "));
                appendText(box, 'span', `${SRD_LOCAL_REASONS[context.reason] || ''} Würfe erscheinen nicht am Tisch.`.trim());
            }
            if (srdTableSession && state !== 'checking') {
                const unbind = document.createElement('button');
                unbind.type = 'button';
                unbind.className = 'srd-roll-link';
                unbind.textContent = globalThis.VTTUi("Tischbindung lösen");
                unbind.addEventListener('click', () => bindSrdTable(character, null));
                box.append(unbind);
            }
            box.dataset.state = state;
        }

        function watchSrdRollContext() {
            const refresh = () => {
                if (document.visibilityState === 'visible' && isSrdCharacter(sheet?.character)) loadSrdRollContext(sheet.character);
            };
            window.addEventListener('focus', refresh);
            document.addEventListener('visibilitychange', refresh);
            window.setInterval(refresh, 60000);
        }

        async function rollFromSheet(character, kind, key, button, extraBody) {
            if (!srdTableSession && srdRollContext?.reason === 'choose_session') {
                renderSrdRollResult({ error: 'Wähle zuerst oben den Tisch, an dem du spielst. Es wurde nicht gewürfelt.' });
                document.getElementById('srdRollSession')?.focus();
                return;
            }
            button.disabled = true;
            try {
                const body = { ...(extraBody || {}), kind, key, mode: srdRollMode, request_id: crypto.randomUUID() };
                if (srdTableSession) body.sessionId = srdTableSession;
                const answer = await srdTableRequest(`/api/srd-creator/characters/${character.id}/roll`, 'POST', body);
                if (!answer) return;
                if (!answer.ok) {
                    renderSrdRollResult({ error: answer.payload.message || 'Der Wurf ist fehlgeschlagen.' });
                    if (String(answer.payload.error || '').startsWith('session_')) loadSrdRollContext(character, true);
                    return;
                }
                const result = answer.payload;
                const roll = result.result;
                const rolls = roll.rolls || [];
                const kept = rolls.join(' + ');
                const modeText = roll.mode === 'advantage' ? ' (Vorteil)' : roll.mode === 'disadvantage' ? ' (Nachteil)' : '';
                const modText = roll.modifier ? ` ${roll.modifier >= 0 ? '+' : '−'} ${Math.abs(roll.modifier)}` : '';
                const shown = rolls.length ? `${kept}${modText}` : String(roll.modifier);
                const entry = {
                    text: `${result.label}${modeText}: ${shown} = ${roll.total}`,
                    natural: roll.natural,
                    logged: result.logged,
                    table: result.session?.name || '',
                    reason: SRD_LOCAL_REASONS[result.reason] || '',
                };
                srdRollHistory.unshift(entry);
                renderSrdRollResult(entry);
                // A roll that stayed local while a table was expected, or the other way round, refreshes the status.
                if (Boolean(result.logged) !== Boolean(srdRollContext?.live)) loadSrdRollContext(character, true);
            } catch (error) {
                renderSrdRollResult({ error: 'Der Wurf ist fehlgeschlagen (keine Verbindung).' });
            } finally {
                button.disabled = false;
            }
        }

        function buildSrdRollBar(character, ev) {
            const bar = document.createElement('div');
            bar.className = 'srd-rollbar';
            bar.id = 'srdRollBar';
            const head = document.createElement('div');
            head.className = 'srd-rollbar-head';
            const label = appendText(head, 'label', globalThis.VTTUi("Würfeln mit "));
            label.htmlFor = 'srdRollMode';
            const select = document.createElement('select');
            select.id = 'srdRollMode';
            SRD_ROLL_MODES.forEach(([value, text]) => select.append(new Option(text, value, false, value === srdRollMode)));
            select.addEventListener('change', () => { srdRollMode = select.value; });
            head.append(select);
            head.append(srdRollButton(globalThis.VTTUi("Initiative {p0}",{p0:(signed(ev.initiative))}), 'initiative', null, character));
            head.append(srdRollButton(globalThis.VTTUi("Todesrettungswurf"), 'death_save', null, character));
            Object.entries((ev.spellcasting || {}).classes || {}).forEach(([classKey, info]) => {
                const cls = (ev.classes || []).find((entry) => entry.classKey === classKey);
                head.append(srdRollButton(globalThis.VTTUi("Zauberangriff {p0} {p1}",{p0:(cls?.name || classKey),p1:(signed(info.attackBonus))}), 'spell_attack', classKey, character));
            });
            bar.append(head);
            const destination = document.createElement('div');
            destination.className = 'srd-roll-destination';
            destination.id = 'srdRollDestination';
            destination.setAttribute('role', 'status');
            destination.setAttribute('aria-live', 'polite');
            renderSrdRollDestination(character, destination);
            bar.append(destination);
            // Every value with a button rolls; the sticky bar jumps to the sections that hold them.
            const jump = document.createElement('nav');
            jump.className = 'srd-roll-jump';
            jump.setAttribute('aria-label', 'Würfe auf dem Bogen');
            appendText(jump, 'span', globalThis.VTTUi("Würfe:"));
            [['Attribute & Rettungswürfe', 'srdAbilitiesTitle'], ['Fertigkeiten', 'srdSkillsTitle'], ['Waffenangriffe', 'srdInventory']].forEach(([text, target]) => {
                const link = document.createElement('button');
                link.type = 'button';
                link.className = 'srd-roll-link';
                link.textContent = text;
                link.addEventListener('click', () => {
                    window.SheetFeedback?.reveal(target);
                    document.getElementById(target)?.scrollIntoView({ block: 'start' });
                });
                jump.append(link);
            });
            bar.append(jump);
            const result = appendText(bar, 'div', globalThis.VTTUi("Klicke auf einen Wert, um zu würfeln."), 'srd-roll-result');
            result.id = 'srdRollResult';
            result.setAttribute('role', 'status');
            result.setAttribute('aria-live', 'polite');
            const history = document.createElement('ul');
            history.className = 'srd-roll-history';
            history.id = 'srdRollHistory';
            bar.append(history);
            if (srdRollHistory.length) setTimeout(() => renderSrdRollResult(srdRollHistory[0]), 0);
            return bar;
        }

        function applySrdManagedState(character) {
            const managed = isSrdCharacter(character);
            SRD_MANAGED_INPUTS.forEach((id) => {
                const node = document.getElementById(id);
                if (node && managed) node.disabled = true;
            });
            ['legacyEquipmentPane', 'legacyInventoryPane'].forEach((id) => {
                const pane = document.getElementById(id);
                if (pane) pane.style.display = managed ? 'none' : '';
            });
        }

        async function renderSrdSheet(character) {
            const section = document.getElementById('srdSheetSection');
            const body = document.getElementById('srdSheetBody');
            const managed = isSrdCharacter(character);
            section.hidden = !managed;
            applySrdManagedState(character);
            if (!managed) {
                body.replaceChildren();
                return;
            }
            const token = ++srdRenderToken;
            let detail;
            try {
                detail = await auth.makeAuthRequest(`/api/srd-creator/characters/${character.id}`);
                if (!srdCreatorData) {
                    srdCreatorData = await auth.makeAuthRequest('/api/srd-creator/creator-data');
                    try {
                        const subclasses = await auth.makeAuthRequest('/api/rulesets/srd-5.2.1-de/compendium?type=subclass&limit=200');
                        (subclasses.items || []).forEach((entry) => { srdSubclassNames[entry.id] = entry.name; });
                    } catch (error) { /* names fall back to ids */ }
                }
            } catch (error) {
                if (token === srdRenderToken) {
                    body.replaceChildren();
                    appendText(body, 'div', globalThis.VTTUi("Die Regelwerte dieses Charakters konnten nicht geladen werden."), 'sheet-empty');
                }
                return;
            }
            if (token !== srdRenderToken) return;
            body.replaceChildren(...buildSrdSheet(character, detail, srdCreatorData));
            loadSrdRollContext(character, true);
            loadSrdInventory(character, updateSrdArmorClass);
            loadSrdManage(character);
            loadSrdProgression(character, detail.evaluation, (info) => {
                if (info?.reload) {
                    Promise.resolve(loadSheet()).then(() => { if (info.message) showMessage(info.message); });
                } else if (info?.xp != null) {
                    document.getElementById('charXp').value = info.xp;
                }
            });
        }

        function updateSrdArmorClass(payload) {
            window.SheetFeedback.updateInventory(payload);
            const cell = document.getElementById('srdAcCell');
            if (!cell || !payload?.armorClass) return;
            const value = cell.querySelector('.srd-sheet-value');
            if (!value) return;

        // A published homebrew Species pinned at finalize: shown from the pin, never from the editable Eagle document.
        function buildSrdOrigin(character, origin) {
            const box = document.createElement('div');
            box.className = 'srd-sheet-origin';
            box.id = 'srdSpeciesOrigin';
            appendText(box, 'div', globalThis.VTTUi("Herkunft: {p0} (Homebrew)",{p0:(origin.name)}), 'srd-sheet-subtitle');
            const movement = (origin.movement || []).map((m) => `${m.label} ${m.feet} ft (${String(m.meters).replace('.', ',')} m)`).join(', ');
            const senses = (origin.senses || []).map((s) => `${s.label} ${s.feet} ft`).join(', ') || 'Keine Dunkelsicht';
            box.append(srdGrid('srd-sheet-facts', [
                srdCell(globalThis.VTTUi("Kreaturentyp"), origin.creatureType?.label || '–'),

                srdCell(globalThis.VTTUi("Bewegung"), movement || '–'),
                srdCell(globalThis.VTTUi("Sinne"), senses),
            ]));
            appendText(box, 'p', globalThis.VTTUi("{p0} · Fassung {p1} · Regelwerk {p2}{p3}",{p0:(origin.scope?.label || ''),p1:(origin.revision ?? '–'),p2:(origin.edition),p3:(origin.author ? ` · veröffentlicht von ${origin.author}` : '')}), 'srd-sheet-note');
            if (origin.description) appendText(box, 'p', origin.description, 'srd-sheet-note');
            if (origin.sensesNote) appendText(box, 'p', origin.sensesNote, 'srd-sheet-note');
            (origin.traits || []).forEach((trait) => {
                const rule = appendText(box, 'p', '', 'srd-sheet-note');
                appendText(rule, 'strong', `${trait.name}: `);
                appendText(rule, 'span', trait.description);
            });
            (origin.actions || []).forEach((action) => box.append(buildSrdOriginAction(character, origin, action)));

        function buildSrdOriginAction(character, origin, action) {
            const form = document.createElement('form');
            form.className = 'srd-origin-action';
            form.dataset.actionId = action.id;
            appendText(form, 'strong', action.name);
            appendText(form, 'p', action.summary, 'srd-sheet-note');
            if (!origin.canAct) return form;
            const input = (labelText, attrs) => {
                const label = document.createElement('label');
                label.textContent = `${labelText} `;
                const field = Object.assign(document.createElement('input'), attrs);
                label.append(field);
                form.append(label);
                return field;
            };
            const object = input('Gegenstand', { type: 'text', maxLength: 160, required: true, name: 'object', placeholder: globalThis.VTTUi("z. B. der Schlüssel auf dem Tisch") });
            const weight = input('Gewicht (lb)', { type: 'number', min: 0.1, max: action.maxWeightLb, step: 0.1, required: true, name: 'weightLb' });
            const distance = input('Entfernung (ft)', { type: 'number', min: 0, max: action.rangeFeet, step: 1, required: true, name: 'distanceFeet' });
            const move = input('Bewegen um (ft)', { type: 'number', min: 1, max: action.maxMoveFeet, step: 1, required: true, name: 'moveFeet' });
            const unattended = input('Niemand trägt oder hält ihn', { type: 'checkbox', required: true, name: 'unattended' });
            const button = Object.assign(document.createElement('button'), { type: 'submit', textContent: globalThis.VTTUi("Am Tisch erklären"), className: 'srd-roll-button' });
            form.append(button);
            // One key per declaration: a retry after a lost answer is recognised by the server and logged once.
            let pendingKey = null;
            form.addEventListener('input', () => { pendingKey = null; });
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                pendingKey = pendingKey || `q${Date.now().toString(36)}${Math.random().toString(36).slice(2, 12)}`;
                button.disabled = true;
                try {
                    const receipt = await auth.makeAuthRequest(`/api/srd-creator/characters/${character.id}/species-actions/${encodeURIComponent(action.id)}`, 'POST', {
                        idempotencyKey: pendingKey, object: object.value, weightLb: Number(weight.value),
                        distanceFeet: Number(distance.value), moveFeet: Number(move.value), unattended: unattended.checked,
                        ...(srdTableSession ? { sessionId: srdTableSession } : {}),
                    });
                    pendingKey = null;
                    form.reset();
                    showMessage(receipt.duplicate ? 'Diese Erklärung steht bereits im Tischprotokoll.' : `${action.name} erklärt: Die Spielleitung sieht es im Tischprotokoll.`);
                } catch (error) {
                    showMessage(error.message || 'Die Aktion konnte nicht erklärt werden.', true);
                } finally {
                    button.disabled = false;
                }
            });
            return form;
        }

        function buildSrdProvenance(detail) {
            const root=document.createElement('details');root.id='srdProvenance';root.className='srd-sheet-provenance';
            appendText(root,'summary',globalThis.VTTUi("Werte und Bonusquellen"));
            const version=detail.evaluation?.provenanceRuleset;
            if(version)appendText(root,'p',globalThis.VTTUi("Regelpaket {p0} · Fassung {p1}",{p0:(version.id),p1:(version.version)}),'srd-sheet-label');
            for(const pin of detail.ruleOrigins || []) {
                const section=document.createElement('section');section.className='srd-sheet-cell';
                appendText(section,'strong',globalThis.VTTUi("{p0} · Homebrew-Fassung {p1}",{p0:(pin.profile.entry.name),p1:(pin.revision)}));
                appendText(section,'p',`${pin.author || ''} · ${pin.scope?.label || pin.scope?.kind || ''}`,'srd-sheet-label');
                appendText(section,'p',pin.profile.description || '');root.append(section);
            }
            const stacking={add:'Beiträge addieren',add_then_cap:'Beiträge addieren, Attributsmaximum beachten',
                best_formula_then_add:'Höchste passende RK-Formel, dann zusätzliche Boni',highest_proficiency_then_add:'Höchste Übung (Expertise ersetzt einfache Übung), dann Attribut',
                ability_modifier:'Attributsmodifikator aus dem fertigen Attribut',ability_modifier_after_override:'Modifikator nach manueller Attributsänderung',level_table:'Übungsbonus nach Gesamtstufe'};
            for(const [key,value] of Object.entries(detail.evaluation?.provenance || {})) {
                const row=document.createElement('details');row.dataset.provenanceKey=key;
                appendText(row,'summary',`${value.label}: ${value.total}`);
                appendText(row,'p',(stacking[value.stacking.replace('_then_override','')] || globalThis.VTTUi("Regelbeiträge"))+(value.stacking.endsWith('_then_override')?globalThis.VTTUi(" · danach manuelle Änderung"):''),'srd-sheet-label');
                const list=document.createElement('ul');
                for(const part of value.contributions) {
                    const li=document.createElement('li');appendText(li,'span',`${part.label}: ${part.value>0?'+':''}${part.value}`);
                    const source=part.source;
                    if(source)appendText(li,'small',` · ${source.name || source.id || source.ruleId || source.sourceId || 'Regelquelle'}${source.revision?' · Fassung '+source.revision:''}`,'srd-sheet-label');
                    for(const grant of source?.grantedBy || [])appendText(li,'small',` · ${grant.name || grant.id}${grant.revision?' · Fassung '+grant.revision:''}`,'srd-sheet-label');
                    list.append(li);
                }
                row.append(list);root.append(row);
            }
            appendText(root,'p',globalThis.VTTUi("Manuelle Änderungen gelten für den gewählten Wert. Weitere Werte können gesondert geändert werden."),'srd-sheet-label');
            return root;
        }

        function buildSrdSheet(character, detail, data) {
            const ev = detail.evaluation || {};
            const state = detail.srd?.state || {};
            const nodes = [buildSrdRollBar(character, ev)];

            const species = srdLookup(data.species, state.species?.id);
            const background = srdLookup(data.backgrounds, state.background?.id) || (detail.ruleOrigins || []).find(pin=>pin.profile.kind==='background')?.profile.entry;
            const alignment = srdLookup(data.alignments, state.identity?.alignment);
            const classText = (ev.classes || []).map((entry) => {
                const sub = entry.subclass ? ` · ${srdSubclassNames[entry.subclass] || String(entry.subclass).split('subclass-').pop().replace(/-/g, ' ')}` : '';
                return `${entry.name} ${entry.level}${sub}`;
            }).join(', ');
            nodes.push(srdGrid('srd-sheet-facts', [
                srdCell(globalThis.VTTUi("Spezies"), species?.name || character.race || '–'),
                srdCell(globalThis.VTTUi("Hintergrund"), background?.name || character.background || '–'),
                srdCell(globalThis.VTTUi("Klasse"), classText || character.class || '–'),
                srdCell(globalThis.VTTUi("Gesinnung"), alignment?.name || '–'),
            ]));
            if (detail.speciesOrigin) nodes.push(buildSrdOrigin(character, detail.speciesOrigin));
            nodes.push(buildSrdProvenance(detail));

            const hp = ev.hitPoints?.max ?? character.hp_max;
            const hitDice = Object.entries(ev.hitDice || {}).map(([die, count]) => `${count}×${die}`).join(' + ');
            const acCell = srdCell(globalThis.VTTUi("Rüstungsklasse"), String(ev.armorClass?.value ?? character.ac), ev.armorClass?.formula || '');
            acCell.id = 'srdAcCell';
            nodes.push(srdGrid('srd-sheet-vitals', [
                acCell,
                srdCell(globalThis.VTTUi("Trefferpunkte"), `${character.hp_current ?? hp} / ${hp}`),
                srdCell(globalThis.VTTUi("Trefferwürfel"), hitDice || '–'),
                srdCell(globalThis.VTTUi("Übungsbonus"), signed(ev.proficiencyBonus)),
                srdCell(globalThis.VTTUi("Initiative"), signed(ev.initiative)),
                srdCell(globalThis.VTTUi("Bewegung"), `${String(ev.speedMeters ?? '–').replace('.', ',')} m`),
                srdCell(globalThis.VTTUi("Passive Wahrnehmung"), String(ev.passivePerception ?? '–')),
                srdCell(globalThis.VTTUi("Stufe"), String(ev.level ?? character.level)),
            ]));

            const abilityCells = SRD_ABILITY_ORDER.map((key) => {
                const ability = (ev.abilities || {})[key] || {};
                const save = (ev.saves || {})[key] || {};
                const cell = document.createElement('div');
                cell.className = 'srd-sheet-cell';
                appendText(cell, 'div', SRD_ABILITY_NAMES[key], 'srd-sheet-label');
                appendText(cell, 'div', `${ability.score ?? '–'} (${signed(ability.modifier)})`, 'srd-sheet-value srd-sheet-ability-score');
                appendText(cell, 'div', globalThis.VTTUi("Rettungswurf {p0}{p1}",{p0:(signed(save.bonus)),p1:(save.proficient ? ' • geübt' : '')}), 'srd-sheet-label');
                const pair = document.createElement('div');
                pair.className = 'srd-roll-pair';
                pair.append(srdRollButton(globalThis.VTTUi("Probe {p0}",{p0:(signed(ability.modifier))}), 'ability', key, character));
                pair.append(srdRollButton(`RW ${signed(save.bonus)}`, 'save', key, character));
                cell.append(pair);
                return cell;
            });
            nodes.push(Object.assign(document.createElement('div'), { className: 'srd-sheet-subtitle', id: 'srdAbilitiesTitle', textContent: globalThis.VTTUi("Attribute") }));
            nodes.push(srdGrid('srd-sheet-abilities', abilityCells));

            const skillList = document.createElement('ul');
            skillList.className = 'srd-sheet-skills';
            Object.entries(ev.skills || {}).forEach(([skillId, skill]) => {
                const row = document.createElement('li');
                if (skill.proficiency !== 'none') row.className = 'is-proficient';
                const rollButton = srdRollButton('', 'skill', skillId, character);
                appendText(rollButton, 'span', `${skill.name}${skill.proficiency === 'expertise' ? ' (Expertise)' : ''}`);
                appendText(rollButton, 'span', signed(skill.bonus));
                row.append(rollButton);
                skillList.append(row);
            });
            nodes.push(Object.assign(document.createElement('div'), { className: 'srd-sheet-subtitle', id: 'srdSkillsTitle', textContent: globalThis.VTTUi("Fertigkeiten") }));
            nodes.push(skillList);

            const casting = ev.spellcasting || {};
            const casterEntries = Object.entries(casting.classes || {});
            if (casterEntries.length) {
                nodes.push(Object.assign(document.createElement('div'), { className: 'srd-sheet-subtitle', textContent: globalThis.VTTUi("Zauberwirken") }));
                const castCells = casterEntries.map(([classKey, info]) => {
                    const cls = data.classes.find((c) => c.classKey === classKey);
                    return srdCell(cls?.name || classKey, `SG ${info.saveDc} · Angriff ${signed(info.attackBonus)}`,
                        `${SRD_ABILITY_NAMES[info.ability] || info.ability}`);
                });
                nodes.push(srdGrid('srd-sheet-facts', castCells));
                const slots = (casting.slots || []).map((count, index) => (count ? `Grad ${SRD_SLOT_ORDINALS[index]}: ${count}` : null)).filter(Boolean);
                if (casting.pact) slots.push('Paktmagie');
                if (slots.length) nodes.push(srdTags(slots));
                Object.entries(state.spells || {}).forEach(([classKey, lists]) => {
                    const cls = data.classes.find((c) => c.classKey === classKey);
                    [['cantrips', globalThis.VTTUi("Zaubertricks")], ['spellbook', globalThis.VTTUi("Zauberbuch")], ['known', globalThis.VTTUi("Bekannte Zauber")], ['prepared', globalThis.VTTUi("Vorbereitet")]].forEach(([key, label]) => {
                        const names = (lists?.[key] || []).map((id) => data.spells[id]?.name || id);
                        if (!names.length) return;
                        nodes.push(Object.assign(document.createElement('div'), { className: 'srd-sheet-subtitle', textContent: `${cls?.name || classKey} · ${label}` }));
                        nodes.push(srdTags(names));
                    });
                });
            }

            const featNames = (ev.feats || []).map((id) => srdLookup(data.feats, id)?.name || id);
            if (featNames.length) {
                nodes.push(Object.assign(document.createElement('div'), { className: 'srd-sheet-subtitle', textContent: globalThis.VTTUi("Talente") }));
                nodes.push(srdTags(featNames));
            }

            const progression = document.createElement('div');
            progression.id = 'srdProgression';
            progression.append(Object.assign(document.createElement('div'), { className: 'sheet-empty', textContent: globalThis.VTTUi("Lade Stufe und Erfahrung…") }));
            nodes.push(progression);

            const inventory = document.createElement('div');
            inventory.id = 'srdInventory';
            inventory.append(Object.assign(document.createElement('div'), { className: 'sheet-empty', textContent: globalThis.VTTUi("Lade Inventar…") }));
            nodes.push(inventory);

            const manage = document.createElement('div');
            manage.id = 'srdManage';
            manage.append(Object.assign(document.createElement('div'), { className: 'sheet-empty', textContent: globalThis.VTTUi("Lade Begleiter und Verwaltung…") }));
            nodes.push(manage);

            const note = document.createElement('p');
            note.className = 'srd-sheet-note';
            note.textContent = globalThis.VTTUi("Diese Werte werden aus den SRD-5.2.1-Regeln berechnet. Name und aktuelle Trefferpunkte änderst du direkt im Bogen, Erfahrung und Stufenaufstieg im Abschnitt „Stufe und Erfahrung“, alles andere im Regelwerk-Ersteller.");
            nodes.push(note);
            const link = document.createElement('a');
            link.className = 'srd-sheet-link';
            link.href = '/srd-creator';
            link.textContent = globalThis.VTTUi("Zum Regelwerk-Ersteller");
            nodes.push(link);
            return window.SheetFeedback.compose(character, detail, data, nodes);
        }

        function renderHomebrewOrigin(character) {
            const origin = character.homebrew_origin;
            // An attached immutable race is changed through the reviewed engine handoff.
            document.getElementById('charRace').disabled = !editable || Boolean(origin);
            const isDnd = ['dnd5e', 'dnd5e_2014', 'dnd5e_2024'].includes(character.system_id);
            const hasOrigin = isDnd && origin && typeof origin === 'object';
            document.getElementById('dndExportSection').hidden = !isDnd;
            document.getElementById('homebrewOriginSection').hidden = !hasOrigin;
            document.getElementById('homebrewOriginTraitsSection').hidden = !hasOrigin;
            const profile = document.getElementById('homebrewOriginProfile');
            const traits = document.getElementById('homebrewOriginTraits');
            profile.replaceChildren();
            traits.replaceChildren();
            if (!hasOrigin) return;

            // Authored rule text is always text, including strings that resemble HTML.
            function appendRule(parent, label, value) {
                if (!value) return;
                const rule = appendText(parent, 'div', '', 'homebrew-origin-copy');
                appendText(rule, 'strong', `${label}: `);
                appendText(rule, 'span', value);
            }

            appendText(profile, 'h3', origin.name);
            const facts = appendText(profile, 'dl', '', 'homebrew-origin-facts');
            const editions = { dnd5e_2014: 'D&D 5e (2014)', dnd5e_2024: 'D&D 5e (2024)' };
            const sizes = { tiny: 'Winzig', small: 'Klein', medium: 'Mittelgroß', large: 'Groß',
                huge: 'Riesig', gargantuan: 'Gigantisch', small_or_medium: 'Klein oder mittelgroß (Auswahl)' };
            [
                ['Regelwerk', editions[origin.edition] || origin.edition],
                ['Kreaturentyp', origin.creatureType],
                ['Größe', sizes[origin.size] || origin.size],
                ['Bewegungsrate', `${origin.speed} ft`],
            ].forEach(([label, value]) => {
                const fact = appendText(facts, 'div', '', 'homebrew-origin-copy');
                appendText(fact, 'dt', label);
                appendText(fact, 'dd', value);
            });
            appendRule(profile, 'Sprachen', origin.languages);
            appendRule(profile, 'Attributsregeln', origin.abilityScoreRules);
            if (origin.prose) appendText(profile, 'p', origin.prose, 'homebrew-origin-copy');
            for (const trait of origin.traits || []) {
                const card = document.createElement('article');
                card.className = 'homebrew-origin-trait';
                appendText(card, 'div', trait.kind === 'feature' ? globalThis.VTTUi("Feature") : globalThis.VTTUi("Merkmal"), 'sheet-pane-title');
                appendText(card, 'h3', trait.name);
                appendText(card, 'p', trait.description, 'homebrew-origin-copy');
                appendRule(card, 'Nutzung', trait.usage);
                appendRule(card, 'Auswahl', trait.choices);
                appendRule(card, 'Voraussetzungen', trait.prerequisites);
                traits.append(card);
            }
        }

        // M27: Export
        async function exportCharacter() {
            try {
                const payload = await auth.makeAuthRequest(`/api/characters/${characterId}/export`);
                const charName = sheet?.character?.name || 'charakter';
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${charName.replace(/\s+/g, '_')}_export.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                showMessage(`${charName} wurde als JSON exportiert. Importiere die Datei im Archiv, um eine Kopie zu erstellen.`);
            } catch (error) {
                showMessage(error.message || 'Export fehlgeschlagen — bitte erneut versuchen.', true);
            }
        }

        function renderSheet() {
            if (!sheet) return;
            document.body.dataset.sheetHasSrd = isSrdCharacter(sheet.character) ? 'true' : 'false';
            document.getElementById('sheetEmptyState').hidden = true;
            document.getElementById('sheetSpread').hidden = false;
            renderCore(sheet.character);
            renderIdentity(sheet.character);
            renderHomebrewOrigin(sheet.character);
            renderSrdSheet(sheet.character);
            renderSpells(sheet.spells || []);
            renderEquipment(sheet.equipment || []);
            renderInventory(sheet.inventory || []);
        }

        async function loadSheet() {
            if (!Number.isInteger(characterId) || characterId <= 0) {
                document.body.dataset.sheetEmpty = 'true';
                document.getElementById('sheetCharacterChip').textContent = globalThis.VTTUi("Kein Charakter gewählt");
                document.getElementById('sheetEmptyState').hidden = false;
                document.getElementById('sheetSpread').hidden = true;
                return;
            }

            try {
                delete document.body.dataset.sheetEmpty;
                currentUser = await auth.requireAuth('/login.html');
                document.getElementById('sheetReaderBadge').textContent = currentUser?.username || globalThis.VTTUi("Sheet Focus");
                sheet = await auth.makeAuthRequest(`/api/characters/${characterId}/sheet`);
                renderSheet();
            } catch (error) {
                showMessage(error.message || 'Failed to load character sheet', true);
            }
        }

        async function reloadSheet() {
            await loadSheet();
            showMessage('Sheet reloaded');
        }

        function openIdentityPicker(identityKind) {
            pendingIdentityKind = identityKind;
            const picker = document.getElementById('sheetIdentityFilePicker');
            if (!picker) return;
            picker.value = '';
            picker.click();
        }

        async function handleIdentityFilePicked(event) {
            const file = event.target.files && event.target.files[0];
            if (!file || !pendingIdentityKind) {
                return;
            }

            const identityKind = pendingIdentityKind;
            pendingIdentityKind = null;
            const formData = new FormData();
            formData.append('file', file);

            try {
                await makeMultipartAuthRequest(
                    `/api/characters/${characterId}/identity/${identityKind}`,
                    'POST',
                    formData,
                );
                await loadSheet();
                const label = identityKind === 'avatar' ? 'Avatar' : 'Token';
                const other = identityKind === 'avatar' ? sheet?.character?.token_url : sheet?.character?.avatar_url;
                const bothSet = !!other;
                const hint = bothSet ? ' Beide Identitätsbilder sind gesetzt.' : ` ${identityKind === 'avatar' ? 'Token' : 'Avatar'} fehlt noch.`;
                showMessage(`${label} gespeichert.${hint}`);
            } catch (error) {
                showMessage(error.message || 'Upload fehlgeschlagen — bitte erneut versuchen.', true);
            } finally {
                event.target.value = '';
            }
        }

        async function removeIdentity(identityKind) {
            const label = identityKind === 'avatar' ? 'Avatar' : 'Token';
            if (!window.confirm(globalThis.VTTUi("{p0} entfernen?",{p0:(label)}))) return;
            try {
                await auth.makeAuthRequest(`/api/characters/${characterId}/identity/${identityKind}`, 'DELETE');
                await loadSheet();
                showMessage(`${label} entfernt.`);
            } catch (error) {
                showMessage(error.message || `${label} konnte nicht entfernt werden.`, true);
            }
        }

        async function saveCore() {
            if (!editable) return;
            try {
                if (isSrdCharacter(sheet?.character)) {
                    await auth.makeAuthRequest(`/api/characters/${characterId}`, 'PUT', {
                        name: document.getElementById('charName').value.trim(),
                        hp_current: Number(document.getElementById('charHpCurrent').value),
                    });
                    await loadSheet();
                    showMessage('Name und aktuelle Trefferpunkte gespeichert.');
                    return;
                }
                const payload = {
                    name: document.getElementById('charName').value.trim(),
                    race: document.getElementById('charRace').value.trim(),
                    class: document.getElementById('charClass').value.trim(),
                    background: document.getElementById('charBackground').value.trim(),
                    level: Number(document.getElementById('charLevel').value),
                    xp: Number(document.getElementById('charXp').value),
                    ac: Number(document.getElementById('charAc').value),
                    hp_current: Number(document.getElementById('charHpCurrent').value),
                    hp_max: Number(document.getElementById('charHpMax').value),
                    str: Number(document.getElementById('charStr').value),
                    dex: Number(document.getElementById('charDex').value),
                    con: Number(document.getElementById('charCon').value),
                    int: Number(document.getElementById('charInt').value),
                    wis: Number(document.getElementById('charWis').value),
                    cha: Number(document.getElementById('charCha').value)
                };
                await auth.makeAuthRequest(`/api/characters/${characterId}`, 'PUT', payload);
                await loadSheet();
                showMessage(sheet?.character?.campaign_id
                    ? 'Core stats saved. Return to campaign context when the hero is ready for play.'
                    : 'Core stats saved. Return to the archive or campaigns when you are ready for the next step.');
            } catch (error) {
                showMessage(error.message || 'Failed to save core stats', true);
            }
        }

        async function addSpell() {
            if (!editable) return;
            try {
                const payload = {
                    name: document.getElementById('newSpellName').value.trim(),
                    level: Number(document.getElementById('newSpellLevel').value || 0),
                    school: document.getElementById('newSpellSchool').value.trim()
                };
                await auth.makeAuthRequest(`/api/characters/${characterId}/spells`, 'POST', payload);
                document.getElementById('newSpellName').value = '';
                document.getElementById('newSpellLevel').value = '';
                document.getElementById('newSpellSchool').value = '';
                await loadSheet();
                showMessage('Spell added');
            } catch (error) {
                showMessage(error.message || 'Failed to add spell', true);
            }
        }

        window.BookSceneRouteInit = window.BookSceneRouteInit || {};
        window.BookSceneRouteInit['character-sheet'] = function initCharacterSheetScene() {
            setEditMode();
            loadSheet();
        };

        document.addEventListener('DOMContentLoaded', () => {
            const picker = document.getElementById('sheetIdentityFilePicker');
