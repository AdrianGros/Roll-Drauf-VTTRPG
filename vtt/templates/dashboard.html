<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTT - Home</title>
    <link rel="icon" type="image/png" href="/static/assets/sternenstaub/icons/server-icon-64.png">

    <!-- Spellbook Theme -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/spellbook-theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/book-shell.css">
    <link rel="stylesheet" href="/static/css/book-page.css">
    <link rel="stylesheet" href="/static/css/book-scene.css">
    <style>
        body.dashboard-route-book-scene {
            background: #0d0514;
            overflow-x: hidden;
            overflow-y: auto;
        }


        #dashboardSceneStatus {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: radial-gradient(ellipse at center, #2d1b35 0%, #0d0514 100%);
            color: var(--vtt-paper, #f8f3e9);
            font-family: var(--vtt-font-heading);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 10;
        }

        #dashboardSceneStatus[hidden] {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="/static/css/vtt-main-nav.css">
</head>
<body class="spellbook dashboard-route-book-scene">
    <div id="dashboardSceneStatus" role="status" aria-live="polite">Übersicht wird vorbereitet …</div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/creation-engine-nav.js"></script>
    <script src="/static/js/regelwerk-navigation.js"></script>
    <script src="/static/js/book-scene.js"></script>
    <script>
        const auth = new Auth();

        async function bootstrapDashboardScene() {
            if (!window.BookScene || typeof BookScene.bootstrapProtectedRoute !== 'function') {
                window.location.href = '/login.html';
                return;
            }

            await BookScene.bootstrapProtectedRoute({
                routeKey: 'dashboard',
                auth,
                statusElementId: 'dashboardSceneStatus',
                statusMessage: 'Übersicht wird vorbereitet …',
                minimumStatusDuration: 620,
                snapshotLoader(user) {
                    return BookScene.loadDashboardSnapshot(user);
                },
            });
        }

        function goTo(path) {
            if (window.BookScene && typeof BookScene.pageTurn === 'function') {
                BookScene.pageTurn(path, BookScene.sceneUser || null);
            } else {
                window.location.href = path;
            }
        }

        async function logout() {
            await auth.logout();
        }

        document.addEventListener('DOMContentLoaded', bootstrapDashboardScene);
    </script>
    <script src="/static/js/vtt-main-nav.js"></script>
</body>
</html>
