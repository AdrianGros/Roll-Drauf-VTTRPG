<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/ui-catalog.js"></script>
    <script src="/static/js/display-preferences.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-ui-key="u_331f833849bf">Passwort zurücksetzen · roll drauf</title>
    <link rel="icon" type="image/png" href="/static/assets/sternenstaub/icons/server-icon-64.png">
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/spellbook-theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
        .recovery-card { width: min(100%, 520px); padding: 32px; border: 1px solid rgba(202,163,59,.35); border-radius: 18px; background: var(--vtt-surface-card); box-shadow: 0 24px 60px rgba(0,0,0,.22); }
        .recovery-card h1 { margin: 0 0 10px; color: var(--vtt-rubric); }
        .recovery-card p { line-height: 1.55; color: var(--vtt-ink-muted); }
        .recovery-card label { display: block; margin: 24px 0 8px; font-weight: 700; }
        .recovery-card input { width: 100%; padding: 12px; border: 2px solid var(--vtt-field-border-strong); border-radius: 8px; box-sizing: border-box; font: inherit; }
        .recovery-card button { margin-top: 16px; }
        .recovery-status { min-height: 1.5em; margin-top: 16px; color: var(--vtt-ink); }
        .recovery-links { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
        .recovery-links a { color: var(--vtt-rubric); }
    </style>
    <link rel="stylesheet" href="/static/css/display-preferences.css">
</head>
<body class="spellbook">
    <main class="recovery-card">
        <p class="book-page-eyebrow"><span data-ui-key="u_ba5eb3abcc5c">Kontozugang</span></p>
        <h1><span data-ui-key="u_ac8579f409c2">Passwort zurücksetzen</span></h1>
        <p><span data-ui-key="u_ca056aafd64f">Gib die E-Mail-Adresse deines Kontos ein. Der Link in der Nachricht ist eine Stunde gültig und kann nur einmal verwendet werden.</span></p>
        <form id="forgotPasswordForm" novalidate>
            <label for="forgotEmail"><span data-ui-key="u_ce8fdbcbfea8">E-Mail-Adresse</span></label>
            <input id="forgotEmail" name="email" type="email" autocomplete="email" required>
            <button class="btn btn-primary" type="submit" id="forgotPasswordSubmit"><span data-ui-key="u_e831ad257a7a">Link anfordern</span></button>
        </form>
        <div id="forgotPasswordStatus" class="recovery-status" role="status" aria-live="polite"></div>
        <nav class="recovery-links" aria-label="Kontozugang" data-ui-aria-label="u_ba5eb3abcc5c">
            <a href="/login.html"><span data-ui-key="u_7573522a50a8">Zur Anmeldung</span></a>
            <a href="/signup.html"><span data-ui-key="u_a8876873dc94">Konto erstellen</span></a>
        </nav>
    </main>
    <script>globalThis.VTTUi ||= (source,parameters={}) => globalThis.VTTI18n?.literal(source,parameters) ?? source.replace(/\{([a-zA-Z0-9_]+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(parameters,k)?String(parameters[k]):m);
globalThis.VTTUiHTML ||= source => globalThis.VTTUi(source).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('forgotPasswordSubmit');
            const status = document.getElementById('forgotPasswordStatus');
            button.disabled = true;
            status.textContent = '';
            try {
                const response = await fetch('/api/auth/password-reset/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('forgotEmail').value.trim() })
                });
                const payload = await response.json().catch(() => ({}));
                status.textContent = payload.message || globalThis.VTTUi("Die Anfrage wurde verarbeitet.");
            } catch (error) {
                status.textContent = globalThis.VTTUi("Die Anfrage konnte gerade nicht verarbeitet werden. Bitte versuche es erneut.");
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
