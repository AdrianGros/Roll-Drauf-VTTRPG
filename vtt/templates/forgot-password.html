<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passwort zurücksetzen · roll drauf</title>
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/spellbook-theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
        .recovery-card { width: min(100%, 520px); padding: 32px; border: 1px solid rgba(202,163,59,.35); border-radius: 18px; background: var(--vtt-surface-card); box-shadow: 0 24px 60px rgba(0,0,0,.22); }
        .recovery-card h1 { margin: 0 0 10px; color: var(--vtt-rubric); }
        .recovery-card p { line-height: 1.55; color: var(--vtt-ink-muted); }
        .recovery-card label { display: block; margin: 24px 0 8px; font-weight: 700; }
        .recovery-card input { width: 100%; padding: 12px; border: 2px solid var(--vtt-field-border-strong); border-radius: 8px; box-sizing: border-box; font: inherit; }
        .recovery-card button { margin-top: 16px; }
        .recovery-status { min-height: 1.5em; margin-top: 16px; color: var(--vtt-ink); }
        .recovery-links { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
        .recovery-links a { color: var(--vtt-rubric); }
    </style>
</head>
<body class="spellbook">
    <main class="recovery-card">
        <p class="book-page-eyebrow">Kontozugang</p>
        <h1>Passwort zurücksetzen</h1>
        <p>Gib die E-Mail-Adresse deines Kontos ein. Der Link in der Nachricht ist eine Stunde gültig und kann nur einmal verwendet werden.</p>
        <form id="forgotPasswordForm" novalidate>
            <label for="forgotEmail">E-Mail-Adresse</label>
            <input id="forgotEmail" name="email" type="email" autocomplete="email" required>
            <button class="btn btn-primary" type="submit" id="forgotPasswordSubmit">Link anfordern</button>
        </form>
        <div id="forgotPasswordStatus" class="recovery-status" role="status" aria-live="polite"></div>
        <nav class="recovery-links" aria-label="Kontozugang">
            <a href="/login.html">Zur Anmeldung</a>
            <a href="/signup.html">Konto erstellen</a>
        </nav>
    </main>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('forgotPasswordSubmit');
            const status = document.getElementById('forgotPasswordStatus');
            button.disabled = true;
            status.textContent = '';
            try {
                const response = await fetch('/api/auth/password-reset/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('forgotEmail').value.trim() })
                });
                const payload = await response.json().catch(() => ({}));
                status.textContent = payload.message || 'Die Anfrage wurde verarbeitet.';
            } catch (error) {
                status.textContent = 'Die Anfrage konnte gerade nicht verarbeitet werden. Bitte versuche es erneut.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
