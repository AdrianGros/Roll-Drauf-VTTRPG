<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/ui-catalog.js"></script>
    <script src="/static/js/display-preferences.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title data-ui-key="u_4d6fe076e730">Neues Passwort · roll drauf</title>
    <link rel="icon" type="image/png" href="/static/assets/sternenstaub/icons/server-icon-64.png">
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/spellbook-theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
        .recovery-card { width: min(100%, 520px); padding: 32px; border: 1px solid rgba(202,163,59,.35); border-radius: 18px; background: var(--vtt-surface-card); box-shadow: 0 24px 60px rgba(0,0,0,.22); }
        .recovery-card h1 { margin: 0 0 10px; color: var(--vtt-rubric); }
        .recovery-card p { line-height: 1.55; color: var(--vtt-ink-muted); }
        .recovery-card label { display: block; margin: 20px 0 8px; font-weight: 700; }
        .recovery-card input { width: 100%; padding: 12px; border: 2px solid var(--vtt-field-border-strong); border-radius: 8px; box-sizing: border-box; font: inherit; }
        .recovery-card button { margin-top: 20px; }
        .recovery-status { min-height: 1.5em; margin-top: 16px; color: var(--vtt-ink); }
        .recovery-links { margin-top: 24px; }
        .recovery-links a { color: var(--vtt-rubric); }
    </style>
    <link rel="stylesheet" href="/static/css/display-preferences.css">
</head>
<body class="spellbook">
    <main class="recovery-card">
        <p class="book-page-eyebrow"><span data-ui-key="u_ba5eb3abcc5c">Kontozugang</span></p>
        <h1><span data-ui-key="u_132cb1bd4db2">Neues Passwort setzen</span></h1>
        <p><span data-ui-key="u_86bbf0b38a30">Wähle ein neues Passwort für dein Konto. Nach dem Speichern musst du dich erneut anmelden.</span></p>
        <form id="resetPasswordForm" novalidate>
            <label for="resetPassword"><span data-ui-key="u_cc5213bdfc29">Neues Passwort</span></label>
            <input id="resetPassword" type="password" autocomplete="new-password" required>
            <label for="resetPasswordConfirm"><span data-ui-key="u_478b138fb0ae">Passwort bestätigen</span></label>
            <input id="resetPasswordConfirm" type="password" autocomplete="new-password" required>
            <button class="btn btn-primary" type="submit" id="resetPasswordSubmit"><span data-ui-key="u_9389a7c1d3e8">Passwort speichern</span></button>
        </form>
        <div id="resetPasswordStatus" class="recovery-status" role="status" aria-live="polite"></div>
        <nav class="recovery-links" aria-label="Kontozugang" data-ui-aria-label="u_ba5eb3abcc5c"><a href="/login.html"><span data-ui-key="u_7573522a50a8">Zur Anmeldung</span></a></nav>
    </main>
    <script>globalThis.VTTUi ||= (source,parameters={}) => globalThis.VTTI18n?.literal(source,parameters) ?? source.replace(/\{([a-zA-Z0-9_]+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(parameters,k)?String(parameters[k]):m);
globalThis.VTTUiHTML ||= source => globalThis.VTTUi(source).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        const token = new URLSearchParams(window.location.search).get('token') || '';
        document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('resetPassword').value;
            const confirmation = document.getElementById('resetPasswordConfirm').value;
            const button = document.getElementById('resetPasswordSubmit');
            const status = document.getElementById('resetPasswordStatus');
            if (!token) { status.textContent = globalThis.VTTUi("Dieser Reset-Link ist unvollständig."); return; }
            if (password !== confirmation) { status.textContent = globalThis.VTTUi("Die Passwörter stimmen nicht überein."); return; }
            button.disabled = true;
            status.textContent = '';
            try {
                const response = await fetch('/api/auth/password-reset/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const payload = await response.json().catch(() => ({}));
                status.textContent = payload.message || payload.error || globalThis.VTTUi("Das Passwort konnte nicht geändert werden.");
                if (response.ok) document.getElementById('resetPasswordForm').hidden = true;
            } catch (error) {
                status.textContent = globalThis.VTTUi("Das Passwort konnte gerade nicht geändert werden. Bitte versuche es erneut.");
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
