<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTT - Characters</title>
    <link rel="icon" type="image/png" href="/static/assets/sternenstaub/icons/server-icon-64.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a9eff;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4a9eff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #357bcc;
        }

        .btn-secondary {
            background: #666;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .btn-danger {
            background: #ff6b6b;
            color: #fff;
            font-size: 0.8rem;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            font-size: 2rem;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-bar input {
            padding: 0.5rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            min-width: 200px;
        }

        .filter-bar select {
            padding: 0.5rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .char-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .char-card:hover {
            border-color: #4a9eff;
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.2);
            transform: translateY(-2px);
        }

        .char-portrait {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #333 0%, #222 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-bottom: 1px solid #444;
            overflow: hidden;
            position: relative;
        }

        .char-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .char-portrait-fallback {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
        }

        .char-info {
            padding: 1rem;
        }

        .char-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .char-class {
            color: #4a9eff;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .char-race {
            color: #a0a0a0;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .char-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin: 0.75rem 0;
            font-size: 0.85rem;
            text-align: center;
        }

        .stat {
            background: rgba(74, 158, 255, 0.1);
            padding: 0.5rem;
            border-radius: 3px;
        }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.75rem;
        }

        .stat-value {
            color: #4a9eff;
            font-weight: bold;
        }

        .char-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .char-actions button {
            flex: 1 1 120px;
            padding: 0.4rem;
            font-size: 0.8rem;
        }

        .char-context-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.35rem;
            padding: 0.24rem 0.55rem;
            border-radius: 999px;
            background: rgba(74, 158, 255, 0.1);
            border: 1px solid rgba(74, 158, 255, 0.25);
            color: #c7ddff;
            font-size: 0.74rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .char-next-step {
            margin-top: 0.7rem;
            color: #dbcfc9;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .char-identity-toolbar {
            display: grid;
            gap: 0.75rem;
            margin-top: 0.85rem;
            padding-top: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .char-identity-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.6rem;
        }

        .char-identity-card {
            display: grid;
            gap: 0.5rem;
            padding: 0.7rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
        }

        .char-identity-head {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            align-items: center;
            color: #d8c8aa;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .char-identity-preview {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.12), rgba(35, 35, 52, 0.88));
            display: grid;
            place-items: center;
            color: #d7d0c6;
            font-size: 1.6rem;
        }

        .char-identity-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .char-identity-copy {
            color: #bfb6ab;
            font-size: 0.8rem;
            line-height: 1.45;
        }

        .char-identity-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .char-identity-actions button {
            flex: 1 1 118px;
            padding: 0.42rem 0.5rem;
            font-size: 0.76rem;
        }

        .journey-note {
            display: grid;
            gap: 0.8rem;
            margin: 1rem 0 1.2rem;
            padding: 1rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(74, 158, 255, 0.25);
            background: rgba(74, 158, 255, 0.12);
        }

        .journey-note[hidden] {
            display: none;
        }

        .journey-note-title {
            color: #f2e5c6;
            font-weight: 700;
        }

        .journey-note-copy {
            color: #d6d2cb;
            line-height: 1.5;
            font-size: 0.92rem;
        }

        .journey-note-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        footer {
            background: rgba(0,0,0,0.3);
            padding: 1rem 2rem;
            border-top: 1px solid #444;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #4a9eff;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #444;
        }

        .modal-header h2 {
            margin: 0;
            color: #e0e0e0;
        }

        .progress {
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .close-btn:hover {
            color: #e0e0e0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #e0e0e0;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.2);
        }

        .form-group--checkbox {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }

        .form-group--checkbox input[type="checkbox"] {
            width: auto;
            flex: 0 0 auto;
            margin-top: 0.2rem;
        }

        .form-group--checkbox .form-group-checkbox-copy {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .form-group--checkbox label {
            margin-bottom: 0;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            border-top: 1px solid #444;
            justify-content: flex-end;
        }

        .modal-footer button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .modal-footer .btn-primary {
            background: #4a9eff;
            color: #fff;
        }

        .modal-footer .btn-primary:hover {
            background: #357bcc;
        }

        .modal-footer .btn-secondary {
            background: #666;
            color: #fff;
        }

        .modal-footer .btn-secondary:hover {
            background: #777;
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .filter-bar {
                flex-direction: column;
            }

            .filter-bar input {
                min-width: 100%;
            }

            .modal-box {
                max-width: 95%;
            }
        }
    </style>
    <!-- Spellbook Theme -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/spellbook-theme.css">

    <style>
        body.characters-route-book-scene {
            background: #0d0514;
            overflow-x: hidden;
            overflow-y: auto;
        }


        #charactersSceneStatus {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: radial-gradient(ellipse at center, #2d1b35 0%, #0d0514 100%);
            color: #f6e8c8;
            font-family: var(--vtt-font-heading);
            letter-spacing: 0.08em;

            z-index: 10;
        }

        #charactersSceneStatus[hidden] {
            display: none;
        }

</head>
<body class="spellbook characters-route-book-scene">
    <div id="charactersSceneStatus" role="status" aria-live="polite">Charaktere werden vorbereitet …</div>
    <input id="identityFilePicker" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/creation-engine-nav.js"></script>
    <script src="/static/js/regelwerk-navigation.js"></script>
    <script src="/static/js/book-scene.js"></script>
    <script>
        const auth = new Auth();
        let allCharacters = [];
        let journeyNoteState = null;
        let pendingIdentityUpload = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showCharactersMessage(text, tone = 'success') {
            const box = document.getElementById('charactersMessageBox');
            if (!box) return;
            box.hidden = false;
            box.className = `book-form-banner is-${tone}`;
            box.textContent = text;
            window.clearTimeout(showCharactersMessage._timer);
            showCharactersMessage._timer = window.setTimeout(() => {
                box.className = 'book-form-banner';
                box.textContent = '';
                box.hidden = true;
            }, 3600);
        }

        async function makeMultipartAuthRequest(url, method, formData, retryOn401 = true) {
            const options = {
                method,
                credentials: 'include',
                headers: Auth.buildHeaders(method, false),
                body: formData,
            };

            let response = await fetch(url, options);
            if (response.status === 401 && retryOn401) {
                const refreshed = await Auth.refreshAccessToken();
                if (refreshed) {
                    return makeMultipartAuthRequest(url, method, formData, false);
                }
                window.location.href = '/login.html';
                return null;
            }

            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(payload.error || 'Upload failed');
            }
            return payload;
        }

        async function bootstrapCharactersScene() {
            const url = new URL(window.location.href);
            if (url.searchParams.get('intent') === 'create') {
                window.location.replace('/srd-creator');
                return;
            }
            const shouldOpenImporter = url.searchParams.get('intent') === 'import';
            if (shouldOpenImporter) {
                consumeCharacterIntent('import');
            }
            if (!window.BookScene || typeof BookScene.bootstrapProtectedRoute !== 'function') {
                window.location.href = '/login.html';
                return;
            }

            const sceneReady = await BookScene.bootstrapProtectedRoute({
                routeKey: 'characters',
                auth,
                statusElementId: 'charactersSceneStatus',
                statusMessage: 'Charaktere werden vorbereitet …',
            });
            if (sceneReady && shouldOpenImporter) {
                openImportModal();
            }
        }

        async function loadCharacters() {
            try {
                const user = await auth.getCurrentUser();
                if (!user) {
                    window.location.href = '/login.html';
                    return;
                }

                allCharacters = await auth.makeAuthRequest('/api/characters/mine');
                if (document.body.classList.contains('characters-route-book-scene')
                        && window.BookScene?.currentView === 'characters') {
                    BookScene.renderSceneRoute('characters', user, {
                        ...BookScene.sceneSnapshot,
                        characters: allCharacters,
                    });
                    renderJourneyNote();
                }
            } catch (error) {
                console.error('Failed to load characters:', error);
                showCharactersMessage('Charaktere konnten nicht geladen werden.', 'error');
            }
        }

        function consumeCharacterIntent(intent) {
            const url = new URL(window.location.href);
            if (url.searchParams.get('intent') !== intent) {
                return false;
            }
            url.searchParams.delete('intent');
            window.history.replaceState({}, '', url.toString());
            return true;
        }
        function openCharacterIdentityPicker(characterId, identityKind) {
            pendingIdentityUpload = { characterId, identityKind };
            const picker = document.getElementById('identityFilePicker');
            if (!picker) return;
            picker.value = '';
            picker.click();
        }

        async function handleCharacterIdentityFilePicked(event) {
            const file = event.target.files && event.target.files[0];
            if (!file || !pendingIdentityUpload) {
                return;
            }

            const { characterId, identityKind } = pendingIdentityUpload;
            pendingIdentityUpload = null;

            const formData = new FormData();
            formData.append('file', file);

            try {
                await makeMultipartAuthRequest(
                    `/api/characters/${characterId}/identity/${identityKind}`,
                    'POST',
                    formData,
                );
                await loadCharacters();
                showCharactersMessage(`${identityKind === 'avatar' ? 'Avatar' : 'Token'} updated.`);
            } catch (error) {
                showCharactersMessage(error.message || 'Failed to upload identity asset', 'error');
            } finally {
                event.target.value = '';
            }
        }

        async function removeCharacterIdentity(characterId, identityKind) {
            if (!window.confirm(`Remove this ${identityKind}?`)) return;
            try {
                await auth.makeAuthRequest(`/api/characters/${characterId}/identity/${identityKind}`, 'DELETE');
                await loadCharacters();
                showCharactersMessage(`${identityKind === 'avatar' ? 'Avatar' : 'Token'} removed.`);
            } catch (error) {
                showCharactersMessage(error.message || 'Failed to remove identity asset', 'error');
            }
        }

        function openCharacterSheet(id, viewMode = 'view') {
            const path = viewMode === 'edit'
                ? `/character-sheet?id=${id}&mode=edit`
                : `/character-sheet?id=${id}`;
            goTo(path);
        }

        function editCharacter(id) {
            openCharacterSheet(id, 'edit');
        }

        function viewCharacter(id) {
            openCharacterSheet(id, 'view');
        }

        function goToCampaignContext(campaignId) {
            if (campaignId) {
                goTo(`/campaigns?campaign_id=${campaignId}`);
                return;
            }
            goTo('/campaigns');
        }

        function clearJourneyNote() {
            journeyNoteState = null;
            renderJourneyNote();
        }

        function renderJourneyNote() {
            const container = document.getElementById('charactersJourneyNote');
            if (!container) return;

            if (!journeyNoteState) {
                container.hidden = true;
                container.innerHTML = '';
                return;
            }

                const campaignAction = journeyNoteState.campaignId
                ? `<button class="btn btn-secondary" onclick="goToCampaignContext(${journeyNoteState.campaignId})">Open Campaign Context</button>`
                : `<button class="btn btn-secondary" onclick="goTo('/campaigns')">Campaigns Hub</button>`;

            container.hidden = false;
            container.innerHTML = `
                <div class="journey-note-title">${journeyNoteState.title}</div>
                <div class="journey-note-copy">${journeyNoteState.message}</div>
                <div class="journey-note-actions">
                    <button class="btn btn-primary" onclick="openCharacterSheet(${journeyNoteState.characterId}, 'edit')">Bogen öffnen</button>
                    ${campaignAction}
                    <button class="btn btn-secondary" onclick="goTo('/campaigns')">Session Assignment Route</button>
                    <button class="btn btn-secondary" onclick="clearJourneyNote()">Dismiss</button>
                </div>
            `;
        }

        async function deleteCharacter(id) {
            if (!confirm('Delete this character?')) return;
            try {
                await auth.makeAuthRequest(`/api/characters/${id}`, 'DELETE');
                await loadCharacters();
                showCharactersMessage('Character deleted.');
            } catch (error) {
                console.error('Failed to delete character:', error);
                showCharactersMessage(error.message || 'Failed to delete character', 'error');
            }
        }

        function goTo(path) {
            if (window.BookScene && typeof BookScene.pageTurn === 'function') {
                BookScene.pageTurn(path, BookScene.sceneUser || null);
            } else {
                window.location.href = path;
            }
        }

        async function logout() {
            await auth.logout();
        }

        // --- M27: Character Import ---

        function openImportModal() {
            document.getElementById('importModal').style.display = 'flex';
            document.getElementById('importPayload').value = '';
            document.getElementById('importError').textContent = '';
            document.getElementById('importSubmitBtn').disabled = false;
            document.getElementById('importPayload').focus();
        }

        function closeImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }

        async function submitImport() {
            const raw = document.getElementById('importPayload').value.trim();
            const errEl = document.getElementById('importError');
            errEl.textContent = '';
            if (!raw) {
                errEl.textContent = 'Paste the exported JSON above.';
                return;
            }
            let payload;
            try {
                payload = JSON.parse(raw);
            } catch (e) {
                errEl.textContent = 'Invalid JSON — paste the full export payload.';
                return;
            }
            const btn = document.getElementById('importSubmitBtn');
            btn.disabled = true;
            try {
                const resp = await auth.makeAuthRequest('/api/characters/import', 'POST', payload);
                closeImportModal();
                const message = `Charakter "${resp.character.name}" importiert.`;
                if (window.BookScene?.currentView === 'characters' && document.body.classList.contains('characters-route-book-scene')) {
                    const snapshot = await BookScene.loadSceneSnapshot();
                    BookScene.renderSceneRoute('characters', snapshot.user, snapshot);
                    const status = BookScene.sceneSurface.querySelector('[data-character-import-status]');
                    if (status) { status.textContent = message; status.hidden = false; }
                } else {
                    await loadCharacters();
                    showCharactersMessage(message);
                }
            } catch (error) {
                errEl.textContent = error.message || 'Import fehlgeschlagen.';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const picker = document.getElementById('identityFilePicker');
            if (picker) {
                picker.addEventListener('change', handleCharacterIdentityFilePicked);
            }
            bootstrapCharactersScene();
        });
    </script>

    <!-- M27: Character Import Modal -->
    <div id="importModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="importModalTitle" style="display:none">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="importModalTitle">Charakter importieren</h2>
                <button class="close-btn" onclick="closeImportModal()">×</button>
            </div>
            <div class="modal-steps">
                <p style="color:#d6d2cb;font-size:0.9rem;margin-bottom:1rem;line-height:1.5;">
                    Füge einen VTT-Export für D&amp;D 5e ein. Ein neuer Charakter wird erstellt; Avatar und Kampagne werden nicht übertragen. Direkte Exporte von D&amp;D Beyond oder Roll20 benötigen eine Formatumwandlung.
                </p>
                <div class="form-group">
                    <label for="importPayload">Export-JSON</label>
                    <textarea id="importPayload" rows="10" style="width:100%;background:rgba(0,0,0,0.4);border:1px solid #444;border-radius:4px;color:#e0e0e0;padding:0.5rem;font-size:0.82rem;font-family:monospace;resize:vertical;" placeholder='{ "export_kind": "character", ... }'></textarea>
                </div>
                <div id="importError" class="error-message"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeImportModal()">Abbrechen</button>
                <button id="importSubmitBtn" class="btn btn-primary" onclick="submitImport()">Importieren</button>
            </div>
        </div>
    </div>
    <script src="/static/js/vtt-main-nav.js"></script>
</body>
</html>
