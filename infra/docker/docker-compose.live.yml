services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vtt
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt
    volumes:
      - vtt_db_data:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.19.0.2
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vtt_redis_data:/data
    networks:
      default:
        ipv4_address: 172.19.0.5
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    env_file:
      - ../../.env.vtt.roll-drauf.de
    networks:
      default:
        # Host nginx (/etc/nginx/conf.d/vtt.conf) proxy_passes to this fixed
        # IP - keep in sync if this ever needs to change.
        ipv4_address: 172.19.0.3
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      DATABASE_URL: postgresql://vtt:vtt@db:5432/vtt
      REDIS_URL: redis://redis:6379/0
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/0
      RATELIMIT_STORAGE_URL: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      CORS_ORIGINS: https://vtt.roll-drauf.de,http://vtt.roll-drauf.de
      AUTO_CREATE_SCHEMA: "true"
      LOG_JSON: "true"
      METRICS_ENABLED: "true"
      VOICE_ENABLED: "false"
      LOCAL_STORAGE_PATH: /data/vtt-assets
      MAIL_SERVER: vtt.roll-drauf.de
      MAIL_PORT: "587"
      MAIL_USE_TLS: "true"
      MAIL_USERNAME: no-reply@vtt.roll-drauf.de
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: no-reply@vtt.roll-drauf.de
    volumes:
      - vtt_assets_data:/data/vtt-assets
    depends_on:
      - db
      - redis
      - mailserver
    expose:
      - "5000"
    restart: unless-stopped

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
    hostname: mail.vtt.roll-drauf.de
    environment:
      OVERRIDE_HOSTNAME: mail.vtt.roll-drauf.de
      PERMIT_DOCKER: none
      POSTFIX_INET_PROTOCOLS: ipv4
      ACCOUNT_PROVISIONER: FILE
      ONE_DIR: "1"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_IMAP: "1"
      ENABLE_POP3: "0"
      ENABLE_OPENDKIM: "1"
      ENABLE_OPENDMARC: "1"
      ENABLE_RSPAMD: "0"
      SPOOF_PROTECTION: "1"
      SSL_TYPE: manual
      SSL_CERT_PATH: /etc/letsencrypt/live/vtt.roll-drauf.de/fullchain.pem
      SSL_KEY_PATH: /etc/letsencrypt/live/vtt.roll-drauf.de/privkey.pem
      TZ: Europe/Berlin
    volumes:
      - ../mailserver/docker-data/dms/mail-data/:/var/mail/
      - ../mailserver/docker-data/dms/mail-state/:/var/mail-state/
      - ../mailserver/docker-data/dms/mail-logs/:/var/log/mail/
      - ../mailserver/docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
        ipv4_address: 172.19.0.6
        aliases:
          - vtt.roll-drauf.de
    expose:
      - "25"
      - "465"
      - "587"
      - "993"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/vtt.roll-drauf.de.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certbot/www:/var/www/certbot:ro
      - ./ops/certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  vtt_db_data:
  vtt_redis_data:
  vtt_assets_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
